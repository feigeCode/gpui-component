[package]
name = "gpui_ce_components_shell"
description = "A scriptable application runtime for GPUI, built on gpui-base."
version.workspace = true
keywords = ["desktop", "gpui", "javascript", "runtime"]
license.workspace = true
publish = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "gpui_shell"
path = "src/lib.rs"

[[bin]]
name = "gpui-shell"
path = "src/bin/gpui-shell.rs"

[features]
default = ["quickjs"]
# The scripting engine. See `src/engine/mod.rs` for the surface an engine has
# to provide; QuickJS is the only implementation today, and the feature exists
# so a second one can be added without the seam having to be invented first.
quickjs = [
  "dep:rquickjs",
  "dep:llrt_buffer",
  "dep:llrt_crypto",
  "dep:llrt_path",
  "dep:llrt_url",
  "dep:llrt_zlib",
  "dep:reqwest",
  "dep:tungstenite",
]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-base = { workspace = true, features = ["inspector"] }
gpui-fps.workspace = true

rquickjs = { version = "0.11", features = [
  "macro",
  "loader",
  "classes",
  "properties",
], optional = true }
# 0.8.1-beta is the newest LLRT series available on crates.io. Keep all
# modules on that published release so the shell itself can be published.
llrt_buffer = { version = "0.8.1-beta", optional = true }
# Use LLRT's Ring provider instead of its vulnerable default RustCrypto/RSA
# implementation.
llrt_crypto = { version = "0.8.1-beta", default-features = false, features = [
  "crypto-ring",
], optional = true }
llrt_path = { version = "0.8.1-beta", optional = true }
llrt_url = { version = "0.8.1-beta", optional = true }
llrt_zlib = { version = "0.8.1-beta", default-features = false, features = [
  "compression-rust",
], optional = true }
# The date type `gpui_base::Date` is built from, for the calendar binding. Same
# version as `gpui-base`'s, because the two exchange `NaiveDate` values.
chrono = "0.4.38"
cap-std = "4.0.3"
async-channel = "2.5"
fs2 = "0.4"
sha2 = "0.10"
wait-timeout = "0.2"
reqwest = { workspace = true, features = ["blocking"], optional = true }
tungstenite = { version = "0.29", features = [
  "rustls-tls-webpki-roots",
  "url",
], optional = true }

anyhow.workspace = true
web-time.workspace = true
palette.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[lints]
workspace = true
