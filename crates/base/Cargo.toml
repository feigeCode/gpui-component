[package]
description = "Behavior, interaction, and infrastructure foundations for GPUI applications."
keywords = ["desktop", "gpui", "ui", "foundation"]
license.workspace = true
name = "gpui_ce_components_base"
# `src/bin/components.rs` is a repository-only showcase launcher that pulls in
# sibling UI sources. It is not part of the standalone foundation crate.
autobins = false
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/gpui_ce_components_base"
version.workspace = true
publish = true
edition.workspace = true

[lib]
name = "gpui_base"
doctest = false

[features]
inspector = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
anyhow.workspace = true
aho-corasick = "1.1.3"
chrono = "0.4.38"
gpui.workspace = true
gpui_macros.workspace = true
instant.workspace = true
lsp-types.workspace = true
palette.workspace = true
ropey.workspace = true
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
sum-tree.workspace = true
tracing.workspace = true
unicode-segmentation = "1.12.0"
web-time = "1"
syntect.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true
gpui_platform.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
indoc = "2"

[lints]
workspace = true
