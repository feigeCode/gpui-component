name: Test Docs
on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/test-docs.yml"
      - "crates/base/**"
      - "crates/story-web/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Checkout latest approved showcases
        uses: actions/checkout@v4
        with:
          repository: longbridge/gpui-kit-showcases
          ref: e52b018f9544a55954bb58bebe353088b81ff30c
          path: .showcases
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0
      - name: Install Showcase validation and rendering dependencies
        working-directory: .showcases
        run: bun install --frozen-lockfile
      - name: Install
        working-directory: website
        run: bun install
      - name: Build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOWCASES_DIR: ${{ github.workspace }}/.showcases
        run: |
          bun run test:showcases
          bun run build
          bun run test:seo
